<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Report Drafting Assistant</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="login-page">
      <h1>Report Drafting Assistant</h1>
      <p>Enter the passcode to continue.</p>
      <form id="login-form" class="login-form">
        <label for="passcode">Passcode</label>
        <input type="password" id="passcode" name="passcode" autocomplete="current-password" autofocus>
        <button type="submit" id="login-button">Sign in</button>
      </form>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
